name: 🔍 Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ─── Skip Draft PRs ──────────────────────────────────────────────────────────
  skip-draft:
    name: Skip Draft PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - run: echo "PR is ready for review — running checks"

  # ─── PR Title Lint ───────────────────────────────────────────────────────────
  pr-title:
    name: 📋 PR Title Convention
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
          # Example valid titles:
          # feat(S2-1): add product CRUD endpoints
          # fix(S4-3): cart quantity exceeds stock
          # chore: update dependencies

  # ─── Changed Files Detection ─────────────────────────────────────────────────
  detect-changes:
    name: 🔎 Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'pos-retail-system/**'

  # ─── Backend Checks (only if backend changed) ────────────────────────────────
  backend-checks:
    name: 🔧 Backend Checks
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: TypeScript
        run: npm run type-check
      - name: ESLint
        run: npm run lint -- --max-warnings 0
      - name: Prisma validate
        run: ./node_modules/.bin/prisma validate
      - name: Build
        run: npm run build

  # ─── Frontend Checks (only if frontend changed) ──────────────────────────────
  frontend-checks:
    name: 🎨 Frontend Checks
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: pos-retail-system
    env:
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      VITE_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pos-retail-system/package-lock.json

      - run: npm ci
      - name: TypeScript
        run: npm run type-check
      - name: ESLint
        run: npm run lint -- --max-warnings 0
      - name: Build
        run: npm run build

  # ─── PR Summary ──────────────────────────────────────────────────────────────
  pr-summary:
    name: 📝 PR Summary
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 PR Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Area | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.detect-changes.outputs.backend == 'true' && '✅ Yes' || '➖ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.detect-changes.outputs.frontend == 'true' && '✅ Yes' || '➖ No' }} |" >> $GITHUB_STEP_SUMMARY
