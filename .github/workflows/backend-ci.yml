name: 🔧 Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  # ─── Type Check ──────────────────────────────────────────────────────────────
  typecheck:
    name: 🔍 TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        # Use local tsc from node_modules — never use bare "npx tsc"
        run: npm run type-check

  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: 🧹 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        # Use npm run lint (local eslint binary) — never use bare "npx eslint"
        run: npm run lint -- --max-warnings 0

  # ─── Build ───────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  # ─── Prisma Schema Validation ────────────────────────────────────────────────
  prisma-validate:
    name: 🗄️ Prisma Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma schema
        # Provide a dummy DATABASE_URL — validate only checks schema syntax, not connectivity
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci_check
        run: ./node_modules/.bin/prisma validate

      - name: Check Prisma format
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci_check
        run: ./node_modules/.bin/prisma format --check
