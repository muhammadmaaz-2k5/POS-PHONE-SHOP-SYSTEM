name: 🎨 Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'pos-retail-system/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pos-retail-system/**'

defaults:
  run:
    working-directory: pos-retail-system

jobs:
  # ─── Type Check ──────────────────────────────────────────────────────────────
  typecheck:
    name: 🔍 TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pos-retail-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: 🧹 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pos-retail-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  # ─── Build ───────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Vite Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    env:
      # Placeholder keys so Vite doesn't fail on missing env vars during build
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
      VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5000/api' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pos-retail-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: pos-retail-system/dist
          retention-days: 1

  # ─── Bundle Size Report ──────────────────────────────────────────────────────
  bundle-size:
    name: 📦 Bundle Size
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pos-retail-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: pos-retail-system/dist

      - name: Report bundle size
        run: |
          echo "📦 Bundle sizes:"
          du -sh dist/assets/*.js 2>/dev/null | sort -h || echo "No JS bundles found"
          du -sh dist/assets/*.css 2>/dev/null | sort -h || echo "No CSS bundles found"
          echo ""
          echo "📁 Total dist size:"
          du -sh dist/
