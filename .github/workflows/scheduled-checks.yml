name: 📅 Scheduled Checks

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  # ─── Dependency Audit ────────────────────────────────────────────────────────
  audit-backend:
    name: 🔒 Backend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Check for outdated packages
        run: npm outdated || true

  audit-frontend:
    name: 🔒 Frontend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-retail-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pos-retail-system/package-lock.json
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Check for outdated packages
        run: npm outdated || true

  # ─── Weekly Summary ──────────────────────────────────────────────────────────
  weekly-summary:
    name: 📊 Weekly Summary
    runs-on: ubuntu-latest
    needs: [audit-backend, audit-frontend]
    if: always()
    steps:
      - name: Post summary
        run: |
          echo "## 📅 Weekly Health Report — $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Security Audit | ${{ needs.audit-backend.result == 'success' && '✅ Clean' || '⚠️ Issues found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Security Audit | ${{ needs.audit-frontend.result == 'success' && '✅ Clean' || '⚠️ Issues found' }} |" >> $GITHUB_STEP_SUMMARY
